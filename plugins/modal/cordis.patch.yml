# modal — the shared modal host (client plugin).
# The host owns one container in shell.overlay and publishes window.__dshModal__.
# The container renders plugins/shared/plugin-modal.tsx, so the component keeps
# exactly one source. The host row exists so the client-module registry mounts
# this package in the web profile and serves that bundle in the boot graph.
- insert:
    - id: modal
      name: modal
