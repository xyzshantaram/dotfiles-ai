# job-viewer — background job buffer, tools, routes, and browser panel.
# The dropdown and modal live in the ./client bundle. The host row exists so
# the client-module registry mounts this package in the web profile and
# serves the bundle; the host half (./lib) does everything else: buffering
# job output, replacement job_list/job_output/job_kill tools, the
# /job-viewer/output and /job-viewer/kill routes, and completion delivery.
- insert:
    - id: job-viewer
      name: job-viewer
