    # #92. A SECOND route onto the same endpoint, differing only in protocol.
    #
    # OpenCode Zen is a mixed-API provider: pi-ai's own README says such
    # providers "dispatch per model", and its 0.85.1 catalog indeed files
    # muse-spark-1.3-contributor under `openai-responses` while the glm/qwen
    # ids on the same host stay `openai-completions`. DSH cannot express that
    # in one route: `api` exists only at route level (RouteCatalogRequest.api,
    # catalog.d.ts:296) and `PiAiModelProfile` has no `api` field at all, so a
    # single route forces one protocol on every model it serves. Splitting the
    # route is the only representable answer.
