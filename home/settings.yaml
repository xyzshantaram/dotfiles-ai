      # sync-models:end
    # #92. A SECOND route onto the same endpoint, differing only in protocol.
    #
    # OpenCode Zen is a mixed-API provider: pi-ai's own README says such
    # providers "dispatch per model", and its 0.85.1 catalog indeed files
    # muse-spark-1.3-contributor under `openai-responses` while the glm/qwen
    # ids on the same host stay `openai-completions`. DSH cannot express that
    # in one route: `api` exists only at route level (RouteCatalogRequest.api,
    # catalog.d.ts:296) and `PiAiModelProfile` has no `api` field at all, so a
    # single route forces one protocol on every model it serves. Splitting the
    # route is the only representable answer.
    #
    # Deferring to the catalog is not available either: the INSTALLED pi-ai is
    # 0.82.1 (2026-07-25), which predates every muse id, so there is nothing to
    # defer to. When DSH bumps past 0.82.x this whole route should be deleted
    # and the models un-seeded — that is exactly what the sync.sh drift check
    # watches for.
    #
    # Verified 2026-09-08 against the live endpoint:
    #   POST /chat/completions muse -> 500 Internal server error
    #   POST /responses        muse -> 200, real response object
    #   CONTROL glm-5.3-flash /chat/completions -> 200
    # i.e. the same key and host serve completions fine for other models and
    # 500 for this one. No sync markers here on purpose: sync-models must not
    # rewrite this list.
    opencode-go-responses:
      displayName: OpenCode Go (Responses)
      apiKeyEnv: OPENCODE_GO_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1/
      headers:
        x-opencode-session: dsh-aidos
      models:
