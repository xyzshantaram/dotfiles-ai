agent-presets:
  default: standard
profile:
  active: personal
  chains:
    # ── frontier ─────────────────────────────────────────────────────────────
    # GLM-5.3-class and above. Deliberately NO flash rungs (owner, 2026-09-08:
    # "GLM 5.3 and above are frontier models, it's only flash ones i don't want
    # to use") and NO ElectronHub: the dev key has only 5 concurrent slots, so
    # it stays pinned to the personal orchestrator head where usage is bounded
    # rather than reachable from every chain that falls back here.
    # #92: the opencode-go muse rung moved to the `-responses` route (that model
    # only answers over /responses; completions 500s), and the
    # `opencode/muse-spark-1.3-contributor-free` rung was REMOVED — the free
    # tier refuses non-OpenCode clients outright ("OpenCode's free tier can only
    # be used in OpenCode"), so it was a rung that could never answer.
    frontier:
      - zai/glm-5.3
      - command-code/meta/muse-spark-1.3-contributor
      - opencode-go-responses/muse-spark-1.3-contributor
      - deepseek-official/deepseek-v4-pro
    # ── flash ────────────────────────────────────────────────────────────────
    # The subagent tier, renamed from `subagent` (owner, 2026-09-08). Muse Spark
    # stays at the head deliberately: it is the model the preset pin names, so a
    # pinned child starts ON a rung of its own chain and failover can walk from
    # there. Break that alignment and pinned children fall outside the chain,
    # which is the bug #81 documents.
    flash:
      - command-code/meta/muse-spark-1.3-contributor
      - command-code/z-ai/glm-5.3-flash
      - zai/glm-5.3-flash
      - opencode-go-responses/muse-spark-1.3-contributor
      - opencode-go/glm-5.3-flash
      - deepseek-official/deepseek-v4-flash
    orchestrator-personal:
      - electronhub/glm-5.3:dev
      - chain:frontier
    orchestrator-work:
      - meridian/claude-opus-5
      - meridian/claude-sonnet-5
      - chain:frontier
    # `see` / `see-work` are TOOL routing, not orchestrator chains: see.ts picks
    # a vision chain BY NAME (`see`, else `see-<profile>`), and sync-models.mjs
    # validates that only these must resolve to a vision-capable model. They are
    # kept for that reason, not by oversight — deleting them without changing
    # see.ts would leave the vision tool with no route.
    see:
      - command-code/Qwen/Qwen3.7-Flash
      - opencode/qwen3.6-plus
    see-work:
      - meridian/claude-haiku-4-5
      - chain:see
  work:
    orchestrator: orchestrator-work
    subagent: flash
  personal:
    orchestrator: orchestrator-personal
    subagent: flash


