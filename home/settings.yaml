          low: low
          medium: medium
          high: high
          xhigh: xhigh
    opencode-go:
      displayName: OpenCode Go
      apiKeyEnv: OPENCODE_GO_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/go/v1/
      # See the `opencode` route above for why this header is mandatory (#92).
      headers:
        x-opencode-session: dsh-aidos
      # NOTE (#92): the sync-models block below is regenerated from this route's
      # live GET /models, which lists the muse ids too — so they will keep
      # reappearing here under `openai-completions` even though they only answer
      # over /responses. That is harmless for CHAINS, which point at the
      # `opencode-go-responses` route below, but a muse model picked by hand
      # from THIS route will 500. Do not "fix" it by deleting the entries; they
      # come back on the next sync. The real fix is a pi-ai bump (see the drift
      # check in sync.sh), after which the catalog dispatches per model.
      models:
      # sync-models:begin
