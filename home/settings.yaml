      - zai/glm-5.3
      - opencode-go-spark/muse-spark-1.3-contributor
      - opencode/muse-spark-1.3-contributor-free
      - deepseek-official/deepseek-v4-pro
    subagent:
      - command-code/meta/muse-spark-1.3-contributor
      - command-code/z-ai/glm-5.3-flash
      - zai/glm-5.3-flash
      - opencode-go-spark/muse-spark-1.3-contributor
      - opencode-go/glm-5.3-flash
      - opencode/muse-spark-1.3-contributor-free
      - deepseek-official/deepseek-v4-flash
    subagent-work:
      - meridian/claude-haiku-4-5
      - chain:subagent
    # SECURITY BOUNDARY - the partner review chain.
    #
    # The aidos gate accepts a review_pass only when its provenance stamp
    # shows a partner-chain run (SPEC-batch-review.md, Gate rule). That
    # makes THIS list the boundary: editing a cheap model into it weakens
    # the review gate silently - no gate error, no warning, just reviews
    # that look partner-grade while running on a cheap tier. Do not add
    # rungs below meridian quality here without an explicit owner decision.
    #
    # Two meridian rungs and deliberately NO cheap fallback: when meridian
    # is unreachable the partner run fails, tickets sit in
    # awaiting_verification, and no degraded review path exists. That is
    # the spec's accepted trade ("reviewer unavailability must never
    # auto-pass"), not an oversight.
    partner:
      - meridian/
      - meridian/
    see:
      - command-code/Qwen/Qwen3.7-Flash
      - opencode/qwen3.6-plus
    see-work:
      - meridian/claude-haiku-4-5
      - chain:see
  work:
    orchestrator: work-orchestrator
    subagent: subagent-work
  personal:
    orchestrator: personal-orchestrator
    subagent: subagent


