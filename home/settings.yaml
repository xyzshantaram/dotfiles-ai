agent-presets:
  default: standard
profile:
  active: personal
  chains:
    work-orchestrator:
      routes:
      - provider: meridian
        model: claude-opus-5
      - provider: meridian
        model: claude-sonnet-5
      - provider: opencode-zen
        model: x-preview-f-free
      - provider: deepseek-official
        model: deepseek-v4-flash
      - provider: opencode
        model: deepseek-v4-flash-free
    personal-orchestrator:
      routes:
      - provider: opencode-zen
        model: hy3-free
      - provider: command-code
        model: xiaomi/mimo-v2.5-pro
      - provider: command-code
        model: deepseek/deepseek-v4-pro
      - provider: opencode
        model: deepseek-v4-flash-free
      - provider: deepseek-official
        model: deepseek-v4-flash
    worker:
      routes:
      - provider: opencode
        model: deepseek-v4-flash-free
      - provider: command-code
        model: deepseek/deepseek-v4-flash
      - provider: deepseek-official
        model: deepseek-v4-flash
      - provider: opencode
        model: deepseek-v4-flash-free
    see:
      routes:
      - provider: command-code
        model: Qwen/Qwen3.7-Flash
      - provider: opencode
        model: qwen3.6-plus
    see-work:
      - meridian/claude-haiku-4-5
      - chain:see
  work:
    orchestrator: work-orchestrator
    subagent: worker
  personal:
    orchestrator: personal-orchestrator
    subagent: worker

