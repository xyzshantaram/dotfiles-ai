    # Deferring to the catalog is not available either: the INSTALLED pi-ai is
    # 0.82.1 (2026-07-25), which predates every muse id, so there is nothing to
    # defer to. When DSH bumps past 0.82.x this whole route should be deleted
    # and the models un-seeded — that is exactly what the sync.sh drift check
    # watches for.
