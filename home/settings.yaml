    opencode:
      displayName: Opencode Zen
      apiKeyEnv: OPENCODE_ZEN_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/v1/
      # #92. WITHOUT this header EVERY request to a zen route is refused, for
      # every model, with 400 MissingSessionID: "Request is missing
      # x-opencode-session and cannot be routed efficiently." Nothing supplies
      # it on our behalf — not DSH, not this repo, and not pi-ai, whose
      # session-affinity switches (sendSessionAffinityHeaders,
      # sessionAffinityFormat) send `user`/`prompt_cache_key` in the BODY and
      # are withheld from profiles by DSH's compat gate anyway. Route-level
      # `headers` is the only seam (dsh-llm-pi-ai config.d.ts:109-110).
      # The value is an affinity bucket, not a credential: one stable string
      # per install is exactly what "routed efficiently" asks for. Verified
      # 2026-09-08: with it, glm-5.3-flash on the go route returns HTTP 200.
      headers:
        x-opencode-session: dsh-aidos
      # Hand-seeded: the installed pi-ai catalog does not describe this id,
      # so sync-models cuts it and the fork reports "not in catalog". Values
      # from models.dev opencode catalog 2026-09-07. No sync markers here on
      # purpose: keep sync-models from cutting it again.
      models:
      - id: muse-spark-1.3-contributor-free
        name: Muse Spark 1.3 Contributor Free
        contextWindow: 1048576
        maxTokens: 131072
        input:
        - text
        - image
