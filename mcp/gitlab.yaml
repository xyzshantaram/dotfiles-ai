# W3 — gitlab MCP server row (glab CLI).
# Row shape verified against DSH/dsh-mcp-client/README.md:11-30.
# `glab mcp serve` is the documented GitLab CLI MCP command
# (https://gitlab.cn/docs/cli/mcp/serve/).
# Model sees tools as mcp__gitlab__<rawName> (README.md:5, 55).
- id: mcp-gitlab
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: gitlab
    transport: stdio
    command: glab
    args:
      - mcp
      - serve
