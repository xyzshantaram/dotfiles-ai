# W3 — nostrbook MCP server row.
# One @deepseek-ai/dsh-mcp-client plugin instance per server.
# Row shape verified against DSH/dsh-mcp-client/README.md:11-30
# (serverName, transport stdio, command, args).
# Model sees tools as mcp__nostrbook__<rawName> (README.md:5, 55).
- id: mcp-nostrbook
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: nostrbook
    transport: stdio
    command: npx
    args:
      - -y
      - '@nostrbook/mcp@latest'
